[project]
name = "neonik"
version = "0.1.86"
description = "The NEONIK runtime library, including NEON and scripts to interact with the backend."
readme = "README.md"
authors = [
    { name = "Vincent Ehrmanntraut", email = "ehrmanntraut@itsec.rwth-aachen.de" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "fastapi>=0.135.1",
    "humanize>=4.15.0",
    "psutil>=7.2.2",
    "pytz>=2026.1.post1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "uvicorn>=0.42.0",
    "zstd==1.5.7.2",
]
classifiers = ["Private :: Do Not Upload"]


publish-url = "https://gitlab.itsec.rwth-aachen.de/api/v4/projects/512/packages/pypi"

[project.scripts]
pull-reports = "neonik.scripts.pull_reports:main"
push-experiments = "neonik.scripts.push_experiments:main"
run-all-experiments = "neonik.scripts.run_all_experiments:run"
neonik-setup = "neonik.scripts.setup_neon:main"
neonik-internal-cli = "neonik.scripts.internal_cli:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"
