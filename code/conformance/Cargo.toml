[package]
name = "conformance"
version = "0.1.0"
edition = "2021"
description = "Alignment-based fitness and ETC-precision of the discovered models, measured with Rust4PM"
publish = false

[dependencies]
# pinned: the evaluation was measured with exactly this version
process_mining = { version = "=0.7.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
